<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inventory — Pokii Dashboard</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div class="container">

    <section id="list-view">
      <div class="btn-row" style="justify-content:space-between; align-items:center;">
        <h1 style="margin:20px 0 0">Inventory</h1>
        <button class="btn" id="show-add-btn">+ Add item</button>
      </div>
      <p class="hint" id="unit-count"></p>
      <div class="card">
        <label for="search-box">Search</label>
        <input id="search-box" placeholder="Search by name…" />
        <label>Type <span class="hint">(check any combination — uncheck one to exclude just that type)</span></label>
        <div class="row" style="display:flex; gap:14px; flex-wrap:wrap; margin-bottom:10px">
          <label style="display:flex;align-items:center;gap:6px;font-weight:normal;color:var(--text)">
            <input type="checkbox" class="category-check" value="funko" checked /> Funko
          </label>
          <label style="display:flex;align-items:center;gap:6px;font-weight:normal;color:var(--text)">
            <input type="checkbox" class="category-check" value="pokemon_card" checked /> Pokémon card
          </label>
          <label style="display:flex;align-items:center;gap:6px;font-weight:normal;color:var(--text)">
            <input type="checkbox" class="category-check" value="other" checked /> Other
          </label>
        </div>
        <label for="sort-select">Sort by</label>
        <select id="sort-select">
          <option value="name">Name (A–Z)</option>
          <option value="value_desc">Value: high to low</option>
          <option value="value_asc">Value: low to high</option>
          <option value="cost_desc">Cost: high to low</option>
          <option value="qty_desc">Quantity: most in stock</option>
          <option value="oldest">Oldest in stock first</option>
        </select>
      </div>
      <div class="card" id="inventory-list">
        <p class="spinner-text">Loading…</p>
      </div>
    </section>

    <section id="detail-view" style="display:none">
      <button class="btn secondary" id="back-btn">← Back</button>
      <div class="card" id="detail-body"></div>
    </section>

    <section id="add-view" style="display:none">
      <button class="btn secondary" id="back-from-add-btn">← Back</button>
      <h1>Add inventory item</h1>
      <p class="hint">For stock you're entering directly — not tied to a logged purchase or sale (e.g. scanning an existing haul photo). This does not touch your cash balances.</p>
      <div class="card">
        <label for="a-name">Name</label>
        <input id="a-name" placeholder="Item name" />
        <label for="a-category">Category</label>
        <select id="a-category">
          <option value="funko">Funko</option>
          <option value="pokemon_card">Pokémon card</option>
          <option value="other">Other</option>
        </select>
        <label for="a-quantity">Quantity</label>
        <input id="a-quantity" type="number" min="1" step="1" value="1" />
        <label for="a-cost">Cost per unit (what you paid, ₪)</label>
        <input id="a-cost" type="number" min="0" step="0.01" placeholder="0.00" />
        <label for="a-value">Estimated resale value per unit (₪, optional)</label>
        <input id="a-value" type="number" min="0" step="0.01" placeholder="leave blank to auto-estimate" />
        <label for="a-photo">Photo (optional)</label>
        <input id="a-photo" type="file" accept="image/*" />
        <div class="btn-row">
          <button class="btn" id="save-add-btn">Add to inventory</button>
        </div>
        <p class="field-error" id="add-error" style="display:none"></p>
      </div>
    </section>

  </div>

  <script type="module" src="assets/js/inventory.js"></script>
</body>
</html>
