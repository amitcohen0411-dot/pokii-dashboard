<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sales — Pokii Dashboard</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div class="container">

    <section id="list-view">
      <div class="btn-row" style="justify-content:space-between; align-items:center;">
        <h1 style="margin:20px 0 0">Sales</h1>
        <button class="btn" id="show-new-btn">+ New</button>
      </div>
      <div class="card" id="sales-list">
        <p class="spinner-text">Loading…</p>
      </div>
    </section>

    <section id="detail-view" style="display:none">
      <button class="btn secondary" id="back-from-detail">← Back</button>
      <div class="card" id="detail-body"></div>
    </section>

    <section id="form-view" style="display:none">
      <button class="btn secondary" id="back-from-form">← Back</button>
      <h1 id="form-heading">New sale</h1>

      <div class="card">
        <label for="s-name">Name (optional — shown first in your sales list)</label>
        <input id="s-name" placeholder="e.g. who bought it, or what it was" />

        <label for="s-date">Sale date</label>
        <input id="s-date" type="date" />

        <label for="s-channel">Channel</label>
        <input id="s-channel" placeholder="Convention, online, …" />

        <label for="s-account">Paid into</label>
        <select id="s-account">
          <option value="bit">Bit</option>
          <option value="cash">Cash</option>
          <option value="card">Card</option>
        </select>

        <label for="s-total">Total sale price (₪)</label>
        <input id="s-total" type="number" step="0.01" min="0" />
      </div>

      <div class="card" id="media-card">
        <label for="s-media">Photo (optional)</label>
        <input id="s-media" type="file" accept="image/*,video/*" />

        <label for="s-hint">Note (optional)</label>
        <textarea id="s-hint" placeholder="Anything worth telling the AI, or describe what was sold"></textarea>

        <div class="btn-row">
          <button class="btn" id="analyze-btn" disabled>Analyze photo</button>
          <button class="btn secondary" id="manual-btn">Skip — enter items manually</button>
        </div>
        <p class="spinner-text" id="analyze-status" style="display:none"></p>
      </div>

      <div class="card" id="draft-card" style="display:none">
        <h3>Items sold <span class="hint">— match each to the right stock item</span></h3>
        <div id="draft-items"></div>
        <button class="btn secondary" id="add-item-btn">+ Add item</button>

        <div class="btn-row">
          <button class="btn" id="confirm-btn">Save sale</button>
        </div>
        <p class="field-error" id="confirm-error" style="display:none"></p>
      </div>
    </section>

  </div>

  <script type="module" src="assets/js/sales.js"></script>
</body>
</html>
